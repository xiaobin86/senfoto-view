name: Build Windows

# 在自托管（self-hosted）Windows runner 上编译 Senfoto (LidarView) 的 Windows 可执行文件。
# 触发：仅在 Actions 页面手动点 Run workflow（workflow_dispatch）。
#
# 方案 C（自托管 runner）：编译树 build/ 留在 runner 本机磁盘，跨 run 天然复用，
# 无需 GitHub 缓存、无 10GB 缓存上限、不限分钟、不烧 GitHub 存储费。
# 前置：在仓库 Settings → Actions → Runners 注册一台 Windows 自托管 runner，
#       并预装 Visual Studio Build Tools(MSVC+WinSDK)、CMake、Ninja、Git
#       （Qt6 可由 superbuild 自行编译，或预装并传 -DQt6_DIR）。
# 用 runs-on: [self-hosted, windows] 路由到该机器。
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    # 防失控：GitHub 单 job 上限 6h，这里留 30 分钟余量
    timeout-minutes: 330

    steps:
      - name: Checkout senfoto-view（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        shell: bash
        run: choco install ninja -y

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtbase qtsvg qttools qtdeclarative qtimageformats'

      - name: Locate Qt6_DIR
        shell: bash
        run: |
          QT6=$(find "${{ runner.workspace }}" -name Qt6Config.cmake 2>/dev/null | head -1)
          QT6_DIR=$(dirname "$QT6")
          echo "Qt6_DIR=$QT6_DIR" >> "$GITHUB_ENV"
          echo "Found Qt6_DIR=$QT6_DIR"

      - name: Clone / update superbuild（Kitware 官方）
        shell: bash
        run: |
          SB="${{ github.workspace }}/lidarview-superbuild"
          if [ -d "$SB/.git" ]; then
            git -C "$SB" pull --recurse-submodules
          else
            git clone --recursive https://gitlab.kitware.com/LidarView/lidarview-superbuild.git "$SB"
          fi

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure（superbuild 指向本地 senfoto 源码）
        shell: bash
        run: |
          cmake -S "${{ github.workspace }}/lidarview-superbuild" \
                -B "${{ github.workspace }}/build" \
                -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -Dlidarview_SOURCE_SELECTION=source \
                -Dlidarview_SOURCE_DIR="${{ github.workspace }}" \
                -DQt6_DIR="$Qt6_DIR"

      - name: Build
        shell: bash
        run: cmake --build "${{ github.workspace }}/build" -j

      - name: Package（cpack，尽力执行）
        shell: bash
        run: |
          cd "${{ github.workspace }}/build"
          ctest -C Release -R cpack || true

      - name: Upload artifact（SenFoToView.exe）
        uses: actions/upload-artifact@v4
        with:
          name: senfoto-windows
          path: ${{ github.workspace }}/build/install/bin/SenFoToView.exe
