<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Gray lines (unselected) - 8 directions, concentric -->
  <g stroke="#999999" stroke-width="2.5" stroke-linecap="round">
    <!-- Up -->
    <line x1="32" y1="20" x2="32" y2="4"/>
    <!-- Up-Right -->
    <line x1="40.5" y1="23.5" x2="51.8" y2="10.2"/>
    <!-- Right -->
    <line x1="44" y1="32" x2="60" y2="32"/>
    <!-- Down-Right -->
    <line x1="40.5" y1="40.5" x2="51.8" y2="51.8"/>
    <!-- Down -->
    <line x1="32" y1="44" x2="32" y2="60"/>
    <!-- Down-Left -->
    <line x1="23.5" y1="40.5" x2="10.2" y2="51.8"/>
    <!-- Left -->
    <line x1="20" y1="32" x2="4" y2="32"/>
    <!-- Up-Left -->
    <line x1="23.5" y1="23.5" x2="10.2" y2="10.2"/>
  </g>
  
  <!-- Colored lines (selected) - from center -->
  <g stroke-linecap="round">
    <line x1="32" y1="32" x2="51.8" y2="51.8" stroke="#6BCB77" stroke-width="8"/>
    <line x1="32" y1="32" x2="32" y2="60" stroke="#4D96FF" stroke-width="8"/>
  </g>
</svg>
